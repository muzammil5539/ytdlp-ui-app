[project]
name = "ytdlp-ui-app"
version = "0.1.0"
description = "Local yt-dlp web app: download queue, scheduler and ffmpeg converter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
